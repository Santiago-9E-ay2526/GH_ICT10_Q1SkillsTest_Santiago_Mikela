<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
     <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
     <title>Skills Test</title>
</head>
<body style="background-color: rgb(220, 180, 245);">
     <h1 style="text-align: center; margin-top: 20px;">Radiant Coffee</h1>
     <div style="margin: 20px; border: 2px solid black; border-radius: 20px; padding: 20px; background-color: white;" >

          <div style="margin-bottom: 20px; margin-top: 20px;">
               <b><label for="customer-name" style="margin-bottom: 5px;">Customer Name:</label></b>
               <input type="text" id="cust-name" class="form-control" placeholder="Enter your name...">
          </div>

          <h3>Menu</h3>
               <label>
                    <input type="checkbox" id="iced-coffee" value="120">
                    Iced Coffee - ₱120
               </label>
               <br>

               <label>
                    <input type="checkbox" id="latte" value="150">
                    Latte - ₱150
               </label>
               <br>

               <label>
                    <input type="checkbox" id="matcha" value="160">
                    Matcha - ₱160
               </label>
               <br>

               <label>
                    <input type="checkbox" id="choco-mousse" value="120">
                    Chocolate Mousse - ₱120
               </label>
               <br>

               <label>
                    <input type="checkbox" id="caramel" value="120">
                    Caramel Macchiato - ₱120
               </label>
               <br>

               <label>
                    <input type="checkbox" id="cake" value="130">
                    Chocolate Cake - ₱130
               </label>
               <br><br>

          <div style="text-align: center;">
               <button py-click="calc_receipt" class="btn btn-info">Generate Receipt</button>
          </div>
          <br><br>

          <div id="receipt"></div>

     </div>

     <py-script src="main.py"></py-script>
</body>
</html>
